<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef0f3" />
    <meta
      name="description"
      content="Личный список задач: добавляйте дела, отмечайте выполненное и возвращайтесь к списку в своём браузере."
    />
    <title>Тихий список: мои задачи</title>
    <script src="theme.js"></script>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#task-input">Перейти к задачам</a>
    <main>
      <header class="masthead">
        <a class="brand" href="./" aria-label="Тихий список, главная">
          <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect x="4" y="4" width="24" height="24" rx="7" />
            <path d="m10 16 4 4 8-8" />
          </svg>
          <span>тихий список</span>
        </a>
        <div class="theme-control" role="group" aria-label="Тема оформления">
          <button
            type="button"
            data-theme-option="light"
            aria-label="Светлая"
            aria-pressed="false"
            title="Светлая тема"
          >
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <circle cx="10" cy="10" r="3.25" />
              <path
                d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6 16 16M4 16l1.4-1.4M14.6 5.4 16 4"
              />
            </svg>
          </button>
          <button
            type="button"
            data-theme-option="dark"
            aria-label="Тёмная"
            aria-pressed="false"
            title="Тёмная тема"
          >
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path
                d="M16.8 12.1A7.2 7.2 0 0 1 7.9 3.2 7.2 7.2 0 1 0 16.8 12.1Z"
              />
            </svg>
          </button>
        </div>
      </header>
      <section class="workspace" aria-labelledby="list-title">
        <div class="workspace-heading">
          <h1 id="list-title">Мои задачи</h1>
          <span class="local-label">Личный список</span>
        </div>
        <div class="list-toolbar">
          <div class="filters" role="group" aria-label="Фильтр задач">
            <button type="button" data-filter="all" aria-pressed="true">
              Все <span id="all-count">0</span>
            </button>
            <button type="button" data-filter="active" aria-pressed="false">
              В работе
            </button>
            <button type="button" data-filter="done" aria-pressed="false">
              Готово
            </button>
          </div>
          <div class="progress-summary">
            <span id="progress-label">0 из 0 выполнено</span>
            <div
              class="progress-track"
              role="progressbar"
              aria-label="Выполненные задачи"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div id="progress"></div>
            </div>
          </div>
        </div>
        <form id="add-form">
          <div class="form-caption">
            <label for="task-input">Новая задача</label
            ><span class="form-hint"><kbd>Enter</kbd> чтобы добавить</span>
          </div>
          <div class="entry-row">
            <input
              id="task-input"
              name="task"
              maxlength="300"
              placeholder="Что нужно сделать?"
              autocomplete="off"
              required
            />
            <button class="add-button" type="submit">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M10 4v12M4 10h12" /></svg
              >Добавить
            </button>
          </div>
        </form>
        <div class="task-region">
          <h2 class="sr-only">Список задач</h2>
          <ul id="tasks" aria-label="Задачи"></ul>
          <div id="empty" class="empty">
            <svg
              class="empty-icon"
              viewBox="0 0 32 32"
              fill="none"
              aria-hidden="true"
            >
              <rect x="6" y="6" width="20" height="20" rx="6" />
              <path d="m11 16 3.5 3.5L21 13" />
            </svg>
            <div>
              <h3>Список пока пуст</h3>
              <p>Запишите первое дело в поле выше.</p>
            </div>
          </div>
        </div>
        <nav id="pagination" aria-label="Страницы задач" hidden>
          <span id="page-range"></span>
          <div class="page-controls">
            <button
              id="previous-page"
              type="button"
              aria-label="Предыдущая страница"
            >
              ‹
            </button>
            <div id="page-list"></div>
            <button
              id="next-page"
              type="button"
              aria-label="Следующая страница"
            >
              ›
            </button>
          </div>
        </nav>
        <span id="save-label" class="sr-only"></span>
      </section>
      <div class="feedback" data-visible="false">
        <p id="notice" role="status" aria-live="polite" aria-atomic="true"></p>
        <button id="undo-delete" type="button" hidden>Отменить удаление</button>
        <button
          id="dismiss-notice"
          type="button"
          aria-label="Закрыть уведомление"
        >
          ×
        </button>
      </div>
      <div class="theme-feedback">
        <p id="theme-notice" role="status" hidden></p>
      </div>
      <noscript
        ><p class="noscript">
          Чтобы работать со списком задач, включите JavaScript в браузере.
        </p></noscript
      >
    </main>
  </body>
</html>
